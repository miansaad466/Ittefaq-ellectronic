<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Ittefaq Electronics</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"></head><body>
<header class="top"><a class="logo" href="/"><b>Ittefaq</b>Admin</a><nav><a href="/">View shop</a><a href="#" id="out" hidden>Log out</a></nav></header>
<div class="wrap">
<div class="panel" id="login"><h2>Admin login</h2><form id="lf" class="form"><input type="password" id="pw" placeholder="Password" required><button>Log in</button></form></div>
<div id="app" hidden>
<div class="panel"><h2 id="ft">Add a product</h2><form id="pf" class="form">
<input id="name" placeholder="Product name" required><input id="category" placeholder="Category (e.g. TVs)" required>
<input id="price" type="number" min="0" placeholder="Price (PKR)" required><input id="stock" type="number" min="0" placeholder="Stock quantity" value="1">
<input id="emoji" placeholder="Emoji icon (e.g. 📺)"><input id="image_url" placeholder="Image URL (optional)">
<textarea id="description" class="full" rows="3" placeholder="Description and warranty"></textarea>
<div class="full"><button>Save product</button> <button type="button" class="ghost" id="cancel" hidden>Cancel edit</button></div></form></div>
<div class="panel" style="overflow:auto"><h2>Products</h2><table><thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=['name','category','price','stock','emoji','image_url','description'];let list=[],editId=null;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
const api=(u,m='GET',b)=>fetch(u,{method:m,headers:{'Content-Type':'application/json','Authorization':'Bearer '+(localStorage.getItem('tok')||'')},body:b?JSON.stringify(b):undefined});
async function show(){const ok=(await (await api('/api/me')).json()).admin;$('#login').hidden=ok;$('#app').hidden=!ok;$('#out').hidden=!ok;if(ok)load()}
async function load(){list=await (await api('/api/products')).json();$('#rows').innerHTML=list.map(p=>`<tr><td>${esc(p.emoji)}</td><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>Rs ${p.price.toLocaleString()}</td><td>${p.stock}</td><td><button class="ghost" onclick="edit(${p.id})">Edit</button> <button class="del" onclick="del(${p.id})">Delete</button></td></tr>`).join('')}
$('#lf').onsubmit=async e=>{e.preventDefault();const r=await api('/api/login','POST',{password:$('#pw').value});if(r.ok){localStorage.setItem('tok',(await r.json()).token);show()}else toast('Wrong password')};
$('#out').onclick=async e=>{e.preventDefault();localStorage.removeItem('tok');show()};
$('#pf').onsubmit=async e=>{e.preventDefault();const b={};F.forEach(f=>b[f]=$('#'+f).value);
const r=editId?await api('/api/products/'+editId,'PUT',b):await api('/api/products','POST',b);
if(r.ok){toast(editId?'Product updated':'Product added');reset();load()}else toast((await r.json()).error||'Could not save')};
function edit(id){const p=list.find(x=>x.id==id);editId=id;F.forEach(f=>$('#'+f).value=p[f]??'');$('#ft').textContent='Edit product';$('#cancel').hidden=false;scrollTo(0,0)}
function reset(){editId=null;$('#pf').reset();$('#stock').value=1;$('#ft').textContent='Add a product';$('#cancel').hidden=true}
$('#cancel').onclick=reset;
async function del(id){if(confirm('Delete this product?')){await api('/api/products/'+id,'DELETE');toast('Product deleted');load()}}
show();
</script></body></html>
